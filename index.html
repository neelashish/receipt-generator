<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReceiptFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0B0D;--card:#121216;--card2:#18181D;--line:#2a2a32;--txt:#ececf1;--mut:#9a9aa8;--acc:#8aa4ff;--acc2:#6d87f0;--ok:#4ade80;--err:#ff6b6b;--warn:#fbbf24}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'DM Sans',Inter,system-ui,-apple-system,Segoe UI,sans-serif;font-size:15px;line-height:1.45;
 background-image:radial-gradient(900px 400px at 50% -120px,rgba(138,164,255,.10),transparent 70%);background-repeat:no-repeat;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--txt)}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;max-width:1500px;margin:0 auto}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em;cursor:pointer;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.brand i{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--acc),#b49cff);display:inline-block}
.topnav{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--card2);padding:9px 16px;border-radius:10px;font-weight:500;transition:.15s;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{border-color:#44444f;background:#1f1f26;transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:var(--acc);color:#0b0b14;border-color:var(--acc);font-weight:600}
.btn.primary:hover{background:#a1b6ff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.danger:hover{border-color:var(--err);color:var(--err)}
main{max-width:1500px;margin:0 auto;padding:8px 28px 60px}
.enter{animation:enter .25s ease both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* home */
.hero{text-align:center;padding:64px 0 36px}
.hero h1{font-size:44px;letter-spacing:-.03em;margin:0 0 8px}
.hero p{color:var(--mut);margin:0;font-size:17px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:22px;max-width:860px;margin:20px auto 0}
.bigcard{text-align:left;background:rgba(24,24,29,.7);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:22px;padding:30px;transition:.2s;display:flex;flex-direction:column;gap:10px}
.bigcard:hover{transform:translateY(-4px);border-color:#4a557e;box-shadow:0 18px 50px -20px rgba(138,164,255,.35)}
.bigcard .ic{font-size:34px}
.bigcard h2{margin:6px 0 0;font-size:22px}
.bigcard p{margin:0;color:var(--mut);flex:1}
.bigcard .go{margin-top:14px;color:var(--acc);font-weight:600}
.home-foot{text-align:center;margin-top:30px}
/* panels */
.pagehead{display:flex;align-items:center;gap:12px;margin:10px 0 18px}
.pagehead h1{font-size:24px;margin:0;letter-spacing:-.02em}
.back{background:none;border:1px solid var(--line);width:36px;height:36px;border-radius:10px}
.back:hover{background:var(--card2)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.ws{display:grid;grid-template-columns:minmax(380px,520px) 1fr;gap:24px;align-items:start}
.ws .form{display:flex;flex-direction:column;gap:14px}
.form h2,.form h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:600}
.form h3{margin-top:8px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut)}
.input{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none;transition:.15s;color:var(--txt)}
.input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(138,164,255,.15)}
.input.bad{border-color:var(--err)}
textarea.input{resize:vertical;min-height:62px}
.err{color:var(--err);font-size:12px;min-height:0}
.err:empty{display:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{display:grid;grid-template-columns:1fr 110px 36px;gap:8px;align-items:start}
.item .x{height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--mut)}
.item .x:hover{border-color:var(--err);color:var(--err)}
.item .amt{text-align:right}
.totalbox{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.totalbox .t{display:flex;justify-content:space-between;font-weight:700;font-size:18px}
.totalbox .w{color:var(--mut);font-size:13px;margin-top:4px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.pv{position:sticky;top:14px}
.pv-label{font-size:12px;letter-spacing:.12em;color:var(--mut);margin-bottom:10px;font-weight:600}
.pv-wrap{overflow:hidden;border-radius:6px;background:#1c1c22;padding:0}
.pv-sizer{position:relative;box-shadow:0 20px 60px -20px #000;margin:0 auto}
.pv-inner{transform-origin:top left;position:absolute;left:0;top:0}
/* import */
.tabs{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:18px}
.tabs button{border:0;background:transparent;padding:8px 18px;border-radius:9px;color:var(--mut);font-weight:500}
.tabs button.on{background:var(--bg);color:var(--txt)}
.drop{border:2px dashed #3a3a46;border-radius:16px;padding:44px 20px;text-align:center;transition:.15s;cursor:pointer;background:rgba(255,255,255,.01)}
.drop:hover,.drop.over{border-color:var(--acc);background:rgba(138,164,255,.06)}
.drop .big{font-size:34px}
.drop p{margin:6px 0 0;color:var(--mut)}
.note{color:var(--mut);font-size:13px}
.msg-err{background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.35);color:#ffb0b0;padding:10px 14px;border-radius:10px;margin-top:14px;font-size:14px}
.msg-ok{background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.3);color:#9df0b9;padding:10px 14px;border-radius:10px}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.sum{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:18px 0 10px}
.chip{padding:4px 10px;border-radius:99px;font-size:13px;border:1px solid var(--line);background:var(--card2)}
.chip.ok{color:var(--ok);border-color:rgba(74,222,128,.35)}
.chip.bad{color:var(--warn);border-color:rgba(251,191,36,.4)}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:480px}
table.dt{border-collapse:collapse;width:100%;font-size:14px}
table.dt th{position:sticky;top:0;background:var(--card2);text-align:left;padding:9px 10px;font-weight:600;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;z-index:1}
table.dt td{padding:5px 8px;border-top:1px solid var(--line);vertical-align:middle}
table.dt tr.bad td{background:rgba(251,191,36,.04)}
table.dt tr.skip td{opacity:.45}
table.dt input.c{background:transparent;border:1px solid transparent;border-radius:7px;padding:6px 8px;width:100%;min-width:90px;outline:none;color:var(--txt)}
table.dt input.c:hover{border-color:var(--line)}
table.dt input.c:focus{border-color:var(--acc);background:var(--bg)}
table.dt input.c.bad{border-color:var(--err)}
.st{font-size:12px;min-width:150px}
.st.e{color:var(--err)}.st.w{color:var(--warn)}.st.o{color:var(--ok)}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.success{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.success .tick{width:44px;height:44px;border-radius:50%;background:rgba(74,222,128,.15);color:var(--ok);display:grid;place-items:center;font-size:22px;animation:pop .4s ease}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.empty{text-align:center;color:var(--mut);padding:50px 10px}
/* modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto;z-index:50;animation:enter .15s ease}
.modal{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;width:100%;max-width:640px}
.modal.wide{max-width:900px}
.modal h2{margin:0 0 4px;font-size:20px}
.modal .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#24242c;border:1px solid var(--line);padding:11px 18px;border-radius:12px;z-index:90;animation:enter .2s ease;box-shadow:0 10px 40px #000a}
.toast.err{border-color:var(--err)}.toast.ok{border-color:rgba(74,222,128,.5)}
.upl{display:flex;align-items:center;gap:12px}
.upl .thumb{width:54px;height:54px;border-radius:10px;border:1px dashed #3a3a46;display:grid;place-items:center;overflow:hidden;background:#fff;color:#999;font-size:11px}
.upl .thumb img{width:100%;height:100%;object-fit:contain}
#printRoot{display:none}

/* ===================== RECEIPT (A4, light) ===================== */
.receipt{width:210mm;height:296.5mm;padding:9mm;background:#fff;color:#000;font-family:Arial,Helvetica,'Liberation Sans',sans-serif;font-size:10.5pt;box-sizing:border-box;overflow:hidden;line-height:1.3}
.receipt *{box-sizing:border-box}
.rc{border:.35mm solid #000;height:100%;display:flex;flex-direction:column}
.rc-head{display:flex;align-items:center;gap:5mm;padding:3.5mm 5mm;border-bottom:.35mm solid #000;min-height:36mm}
.rc-logo{width:27mm;height:27mm;flex:none;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center}
.rc-logo img,.rc-logo svg{width:100%;height:100%;object-fit:cover;display:block}
.rc-htxt{flex:1;text-align:center}
.rc-name{font-family:'Times New Roman',Times,'Liberation Serif',serif;font-weight:700;font-size:30pt;letter-spacing:.03em;line-height:1.05;text-transform:uppercase}
.rc-addr{font-size:9.5pt;margin-top:2mm;white-space:pre-line}
.rc-contact{font-size:9.5pt;margin-top:1mm}
.rc-contact .dot{font-size:7pt;margin:0 1mm}
.rc-gst{font-size:9.5pt;font-weight:700;margin-top:1mm}
.rc-to{display:flex;border-bottom:.35mm solid #000;min-height:28mm}
.to-l{flex:1;padding:2.5mm 3mm 2mm;display:flex;flex-direction:column;gap:1mm;border-right:.35mm solid #000;min-width:0}
.to-row{display:flex;align-items:flex-end;min-height:7mm}
.to-row .lbl{width:11mm;font-weight:700;flex:none}
.to-row .val{flex:1;border-bottom:.25mm solid #000;padding:0 1.5mm 0.5mm;min-height:6.5mm;white-space:pre-line;overflow-wrap:anywhere;font-size:10.5pt}
.to-r{width:38%;display:flex;flex-direction:column}
.to-r>div{flex:1;padding:2mm 3mm;display:flex;align-items:center;gap:3mm;flex-wrap:wrap}
.to-r>div:first-child{border-bottom:.35mm solid #000}
.to-r b{font-size:11pt}
.to-r .no{font-weight:700;font-size:15pt}
.to-r .dt{font-weight:700;font-size:11pt}
.tr{display:grid;grid-template-columns:15mm 1fr 34mm}
.tr>div{padding:1.5mm 2.5mm}
.tr.h{border-bottom:.35mm solid #000;font-weight:700;font-size:11pt}
.tr.h>div+div{border-left:.35mm solid #000}
.tr.h>div:nth-child(2){text-align:center}.tr.h>div:nth-child(3){text-align:center}
.tbody{flex:1;position:relative;min-height:0;overflow:hidden}
.tbody .vl{position:absolute;top:0;bottom:0;border-left:.35mm solid #000}
.tbody .grid{display:grid;grid-template-columns:15mm 1fr 34mm;grid-auto-rows:min-content;position:relative}
.tbody .grid>div{padding:1.5mm 2.5mm;min-height:8mm;font-size:10.5pt;overflow-wrap:anywhere}
.tbody .grid>div:nth-child(3n+1){text-align:center}
.tbody .grid>div:nth-child(3n){text-align:right}
.tr.t{border-top:.35mm solid #000;font-weight:700}
.tr.t>div{padding:2mm 2.5mm}
.tr.t>div:nth-child(2){text-align:right}
.tr.t>div:nth-child(3){text-align:right;border-left:.35mm solid #000;font-size:11.5pt}
.tr.t>div:nth-child(1){}
.rc-decl{border-top:.35mm solid #000;padding:2.2mm 3mm;font-weight:700;text-align:center;font-size:10pt}
.rc-words{border-top:.35mm solid #000;padding:2.5mm 3mm;display:flex;gap:3mm;min-height:15mm;align-items:center}
.rc-words b{white-space:nowrap;font-size:10.5pt}
.rc-words span{font-size:11pt;font-weight:600}
.rc-bot{display:grid;grid-template-columns:38% 25% 37%;border-top:.35mm solid #000;height:46mm}
.rc-bot>div{min-width:0}
.bk{display:flex;flex-direction:column}
.bk .bank{flex:1;padding:2.5mm 3mm;font-size:9.5pt}
.bk .bank b.t{font-size:11pt;text-decoration:underline;display:block;margin-bottom:1.5mm}
.bk .bank div{font-weight:700;font-size:9pt;line-height:1.55}
.bk .terms{border-top:.35mm solid #000;padding:2mm 3mm;min-height:19mm;font-size:9.5pt}
.bk .terms b{font-size:10.5pt;display:block;margin-bottom:.5mm}
.bk .tl{min-height:4.5mm;font-size:9.5pt}
.pb{border-left:.35mm solid #000;border-right:.35mm solid #000;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:2mm;text-align:center}
.pb .pn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1mm;font-size:10pt;font-weight:600;min-height:0;width:100%}.pb .pn img{max-height:17mm;max-width:100%;object-fit:contain}
.pb .lb{font-weight:700;font-size:10.5pt}
.sg{display:flex;flex-direction:column;align-items:center;text-align:center;padding:2.5mm 3mm}
.sg .c{font-size:10pt;line-height:1.3}
.sg .f{font-weight:700;font-size:11pt;margin-top:1mm}
.sg .im{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:0;padding:1mm 0}
.sg .im img{max-height:15mm;max-width:100%;object-fit:contain}
.sg .lb{font-weight:700;font-size:10.5pt}

@media (max-width:980px){
 .ws{grid-template-columns:1fr}.pv{position:static}
 .cards{grid-template-columns:1fr}.hero h1{font-size:34px}
 main,.topbar{padding-left:16px;padding-right:16px}
 .item{grid-template-columns:1fr 92px 34px}
}
@page{size:A4;margin:0}
@media print{
 html,body{background:#fff!important;margin:0!important;padding:0!important;color-scheme:light}
 body>*:not(#printRoot){display:none!important}
 #printRoot{display:block!important}
 .receipt{break-after:page;page-break-after:always;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .receipt:last-child{break-after:auto;page-break-after:auto}
}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <button class="brand" onclick="location.hash='#/'"><i></i>ReceiptFlow</button>
    <div class="topnav">
      <button class="btn ghost sm" onclick="location.hash='#/history'">Recent Receipts</button>
      <button class="btn ghost sm" onclick="openProfile()">Business Profile</button>
    </div>
  </div>
  <main id="view"></main>
</div>
<div id="printRoot"></div>
<div id="overlay"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// ==CORE==
const pad=n=>String(n).padStart(2,'0');
const ONES=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
const TENS=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
function below100(n){return n<20?ONES[n]:TENS[Math.floor(n/10)]+(n%10?' '+ONES[n%10]:'')}
function below1000(n){const h=Math.floor(n/100),r=n%100;return [h?ONES[h]+' Hundred':'',r?below100(r):''].filter(Boolean).join(' ')}
function intWords(n){
  if(n===0)return 'Zero';
  const parts=[];
  const cr=Math.floor(n/1e7);n%=1e7;
  const la=Math.floor(n/1e5);n%=1e5;
  const th=Math.floor(n/1e3);n%=1e3;
  if(cr)parts.push(intWords(cr)+' Crore');
  if(la)parts.push(below100(la)+' Lakh');
  if(th)parts.push(below100(th)+' Thousand');
  if(n)parts.push(below1000(n));
  return parts.join(' ');
}
function amountInWords(a){
  if(!isFinite(a)||a<0)return '';
  const paise=Math.round(a*100),r=Math.floor(paise/100),p=paise%100;
  let s=intWords(r)+(r===1?' Rupee':' Rupees');
  if(p)s+=' and '+below100(p)+(p===1?' Paisa':' Paise');
  return s+' Only';
}
function parseAmount(v){
  if(typeof v==='number')return isFinite(v)?v:NaN;
  if(v==null)return NaN;
  let s=String(v).trim().replace(/^(₹|rs\.?|inr)\s*/i,'').replace(/[,\s]/g,'');
  if(!/^(\d+\.?\d*|\.\d+)$/.test(s))return NaN;
  return Number(s);
}
const MONTHS=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
function mkIso(y,m,d){
  if(y<100)y+=2000;
  const dt=new Date(Date.UTC(y,m-1,d));
  if(dt.getUTCFullYear()!==y||dt.getUTCMonth()!==m-1||dt.getUTCDate()!==d)return null;
  return y+'-'+pad(m)+'-'+pad(d);
}
// returns '' (empty), ISO string, or null (unrecognised)
function parseDate(v){
  if(v==null)return '';
  if(v instanceof Date){
    if(isNaN(v))return null;
    const t=new Date(v.getTime()+12*3600e3);
    return mkIso(t.getFullYear(),t.getMonth()+1,t.getDate());
  }
  if(typeof v==='number'){
    if(v>20000&&v<80000){const t=new Date(Math.round((v-25569)*864e5));return mkIso(t.getUTCFullYear(),t.getUTCMonth()+1,t.getUTCDate())}
    return null;
  }
  const s=String(v).trim();
  if(!s)return '';
  let m;
  if(m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/))return mkIso(+m[1],+m[2],+m[3]);
  if(m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/))return mkIso(+m[3],+m[2],+m[1]);
  if(m=s.match(/^(\d{1,2})[\s-]+([A-Za-z]{3,9})[\s,.-]+(\d{2,4})$/)){
    const mi=MONTHS.indexOf(m[2].slice(0,3).toLowerCase());
    if(mi>=0)return mkIso(+m[3],mi+1,+m[1]);
  }
  return null;
}
function fmtDate(iso){
  if(!iso)return '';
  const m=iso.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m)return iso;
  return m[3]+' '+MONTHS[+m[2]-1].replace(/^./,c=>c.toUpperCase())+' '+m[1];
}
function fmtAmt(n){
  if(typeof n!=='number'||!isFinite(n))return '';
  return n.toLocaleString('en-IN',{minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2});
}
function sumItems(items){return Math.round(items.reduce((s,i)=>s+(isFinite(i.amount)?i.amount:0),0)*100)/100}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}

const MAX_ITEMS=14;
const FIELDS=[['name','Recipient Name',true],['address','Address',false],['reference','Reference / ID',false],['receiptNo','Receipt / Invoice No.',false],['date','Date',false],['particular','Particulars',true],['amount','Amount',true]];
const SYN={
  name:['name','studentname','customername','recipient','recipientname','clientname','payer','receivedfrom','payername','candidatename','fullname','memberName'.toLowerCase()],
  address:['address','addr','location','city','residence'],
  reference:['studentid','id','reference','ref','referenceid','rollno','rollnumber','enrollment','enrollmentno','admissionno','regno','registrationno','customerid','clientid','memberid'],
  receiptNo:['receiptno','receiptnumber','receipt','invoiceno','invoicenumber','invoice','billno','billnumber','voucherno','srno'],
  date:['date','receiptdate','invoicedate','paymentdate','paiddate','dateofpayment','billdate'],
  particular:['particular','particulars','description','item','items','details','purpose','feefor','feetype','service','towards','narration'],
  amount:['amount','amountrs','amountpaid','fee','fees','price','payment','total','paid','rs','inr','cost','charges']
};
const normH=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
function autoMap(headers){
  const pairs=[];
  headers.forEach((h,i)=>{
    const n=normH(h);if(!n)return;
    Object.keys(SYN).forEach(f=>{
      let best=0;
      SYN[f].forEach(s=>{
        if(n===s)best=Math.max(best,10);
        else if(s.length>=4&&n.includes(s))best=Math.max(best,5+s.length/100);
        else if(n.length>=3&&s.includes(n)&&s.length-n.length<=3)best=Math.max(best,2);
      });
      if(best)pairs.push([best,f,i]);
    });
  });
  pairs.sort((a,b)=>b[0]-a[0]);
  const map={};FIELDS.forEach(([k])=>map[k]=-1);
  const usedH=new Set();
  pairs.forEach(([,f,i])=>{if(map[f]===-1&&!usedH.has(i)){map[f]=i;usedH.add(i)}});
  return map;
}
function cellText(v){return v==null?'':(v instanceof Date?(parseDate(v)||''):String(v).trim())}
function dateCell(v){if(v==null||v==='')return '';const d=parseDate(v);return d===null?String(v).trim():d}
function buildRows(data,map){
  const rows=[];
  data.forEach((r,i)=>{
    const g=k=>map[k]>=0?cellText(r[map[k]]):'';
    const row={n:i+2,name:g('name'),address:g('address'),reference:g('reference'),receiptNo:g('receiptNo'),
      date:map.date>=0?dateCell(r[map.date]):'',particular:g('particular'),amount:g('amount'),include:true};
    if(!(row.name||row.address||row.reference||row.receiptNo||row.date||row.particular||row.amount))return;
    rows.push(row);
  });
  return rows;
}
function validateRow(r){
  const errors=[],warns=[],bad={};
  if(!String(r.name).trim()){errors.push('Recipient name is missing.');bad.name=1}
  if(!String(r.particular).trim()){errors.push('Particular is missing.');bad.particular=1}
  const a=String(r.amount).trim();
  if(!a){errors.push('Amount is missing.');bad.amount=1}
  else{
    const n=parseAmount(a);
    if(isNaN(n)){errors.push('Amount is not a valid number.');bad.amount=1}
    else if(n<=0){errors.push('Amount must be greater than zero.');bad.amount=1}
  }
  if(parseDate(r.date)===null){errors.push("Date isn't recognised (use DD/MM/YYYY).");bad.date=1}
  if(!String(r.receiptNo).trim())warns.push('Receipt number is missing.');
  return {errors,warns,bad};
}
function groupReceipts(rows){
  const out=[],idx={};
  rows.forEach(r=>{
    if(!r.include||validateRow(r).errors.length)return;
    const item={description:r.particular.trim(),amount:parseAmount(r.amount)};
    const rn=String(r.receiptNo).trim(),key=rn?rn+'|'+r.name.trim().toLowerCase():null;
    if(key&&idx[key]!==undefined){out[idx[key]].items.push(item);return}
    const rec={id:'r'+Date.now().toString(36)+out.length,recipientName:r.name.trim(),address:r.address.trim(),reference:r.reference.trim(),
      receiptNumber:rn,date:parseDate(r.date)||'',items:[item]};
    if(key)idx[key]=out.length;
    out.push(rec);
  });
  return out;
}

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function buildZip(files){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  const d=new Date(),dt=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),dd=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  files.forEach(f=>{
    const nm=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(10,dt,true);lh.setUint16(12,dd,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(lh.buffer),nm,f.data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(12,dt,true);ch.setUint16(14,dd,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    cd.push(new Uint8Array(ch.buffer),nm);
    off+=30+nm.length+sz;
  });
  const cdLen=cd.reduce((s,a)=>s+a.length,0),end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cdLen,true);end.setUint32(16,off,true);
  return new Blob([...parts,...cd,new Uint8Array(end.buffer)],{type:'application/zip'});
}
function buildPdf(jpg,w,h){
  const enc=new TextEncoder(),chunks=[],offs=[];let len=0;
  const push=b=>{if(typeof b==='string')b=enc.encode(b);chunks.push(b);len+=b.length};
  const obj=(n,body)=>{offs[n]=len;push(n+' 0 obj\n'+body+'\nendobj\n')};
  push('%PDF-1.4\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>');
  const cs='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
  obj(4,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
  offs[5]=len;push('5 0 obj\n<< /Type /XObject /Subtype /Image /Width '+w+' /Height '+h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpg.length+' >>\nstream\n');
  push(jpg);push('\nendstream\nendobj\n');
  const x=len;let xr='xref\n0 6\n0000000000 65535 f \n';
  for(let i=1;i<=5;i++)xr+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(xr+'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+x+'\n%%EOF');
  return new Blob(chunks,{type:'application/pdf'});
}

// Renders one receipt to a canvas without any external library (SVG foreignObject).
async function receiptToCanvas(r){
  const host=document.createElement('div');
  host.style.cssText='position:fixed;left:-10000px;top:0';
  host.innerHTML=receiptHTML(r,biz);document.body.appendChild(host);
  try{
    const el=host.firstElementChild,rect=el.getBoundingClientRect();
    const W=Math.ceil(rect.width),H=Math.ceil(rect.height);
    const xhtml=new XMLSerializer().serializeToString(el);
    const css=$('style').textContent.replace(/&/g,'&amp;').replace(/</g,'&lt;');
    const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml"><style>'+css+'</style>'+xhtml+'</div></foreignObject></svg>';
    const img=new Image();
    await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error('render failed'));img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)});
    const S=2,c=document.createElement('canvas');c.width=W*S;c.height=H*S;
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    return c;
  }finally{host.remove()}
}
async function makePdf(r){

  for(let i=0;i<bin.length;i++)jpg[i]=bin.charCodeAt(i);
  return buildPdf(jpg,c.width,c.height);
}
async function downloadPdf(r,btn){

async function downloadZip(list,btn){
  if(needBiz())return;
  const lbl=btn.textContent;btn.disabled=true;
  try{
    const files=[],used={};
    for(let i=0;i<list.length;i++){
      btn.textContent='Preparing '+(i+1)+' / '+list.length+'…';
      const blob=await makePdf(list[i]);
      let n=fileBase(list[i]);if(used[n]){used[n]++;n+='-'+used[n]}else used[n]=1;
      files.push({name:n+'.pdf',data:new Uint8Array(await blob.arrayBuffer())});
      await new Promise(r=>setTimeout(r));
    }
    saveBlob(buildZip(files),'Receipts-'+list.length+'.zip');

function readImage(file,max){
  return new Promise((res,rej)=>{
    if(!/^image\//.test(file.type))return rej(new Error('Please choose an image file.'));
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('Could not read file.'));
    fr.onload=()=>{const img=new Image();
      img.onerror=()=>rej(new Error('Not a valid image.'));
      img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');
        c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/png'))};
      img.src=fr.result};
    fr.readAsDataURL(file);
  });
}

function mReceipt(){return {recipientName:M.recipientName.trim(),address:M.address.trim(),reference:M.reference.trim(),receiptNumber:M.receiptNumber.trim(),date:M.date,items:M.items.map(i=>({description:i.description.trim(),amount:parseAmount(i.amount)}))}}
function mErrors(){
  const e={items:M.items.map(()=>({}))};
  if(!M.recipientName.trim())e.name='Recipient name is required.';
  if(!M.receiptNumber.trim())e.receiptNumber='Receipt number is required.';
  if(M.date&&parseDate(M.date)===null)e.date='Enter a valid date.';
  M.items.forEach((it,i)=>{
    if(!it.description.trim())e.items[i].description='Description is required.';
    const a=it.amount.trim();
    if(!a)e.items[i].amount='Amount is required.';
    else{const n=parseAmount(a);if(isNaN(n))e.items[i].amount='Enter a valid number.';else if(n<=0)e.items[i].amount='Must be above zero.'}
  });
  return e;
}
function mHasErr(e){return !!(e.name||e.receiptNumber||e.date||e.items.some(x=>x.description||x.amount))}
function manualView(){
  if(!M)newManual();
  setView('<div><div class="pagehead"><button class="back" onclick="location.hash=\'#/\'" aria-label="Back">←</button><h1>Create Receipt</h1></div>'+
  '<div id="bizb" class="msg-err" style="margin:0 0 16px;display:'+((biz.name||'').trim()?'none':'flex')+';justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><span>Add your business details so they appear on your receipts.</span><button class="btn sm primary" onclick="openProfile()">Set up Business Profile</button></div>'+
  '<div class="ws"><section class="panel form">'+
   '<h2>Receipt Details</h2>'+
   '<label class="f">Recipient Name<input class="input" id="f-name" autocomplete="off"><span class="err" id="e-name"></span></label>'+
   '<label class="f">Address<textarea class="input" id="f-address" rows="2"></textarea></label>'+
   '<label class="f">Reference / Student ID<input class="input" id="f-reference" autocomplete="off"></label>'+
   '<div class="row2"><label class="f">Receipt / Invoice Number<input class="input" id="f-receiptNumber" autocomplete="off"><span class="err" id="e-receiptNumber"></span></label>'+
   '<label class="f">Date<input class="input" type="date" id="f-date"><span class="err" id="e-date"></span></label></div>'+
   '<h3>Particulars</h3><div id="items" style="display:flex;flex-direction:column;gap:10px"></div>'+
   '<div><button class="btn sm" id="add">+ Add Item</button> <span class="note" id="cap"></span></div>'+
   '<h3>Signatures</h3><label class="f">Prepared By (name)<input class="input" id="f-prep" autocomplete="off" placeholder="e.g. Accounts Dept."></label>'+
   '<div class="row2"><div class="f"><span>Prepared By signature</span><div class="upl"><div class="thumb" id="th-preparedSig"></div><div><button class="btn sm" data-sig="preparedSig">Upload</button> <button class="btn sm ghost" data-sigrm="preparedSig">Remove</button></div></div></div>'+
   '<div class="f"><span>Authorised Signature</span><div class="upl"><div class="thumb" id="th-signature"></div><div><button class="btn sm" data-sig="signature">Upload</button> <button class="btn sm ghost" data-sigrm="signature">Remove</button></div></div></div></div>'+
   '<div class="note">Saved with your Business Profile and used on every receipt.</div>'+
   '<div class="totalbox"><div class="t"><span>Total</span><span id="tot"></span></div><div class="w" id="words"></div></div>'+
   '<div class="actions"><button class="btn primary" id="print">Print / Save PDF</button><button class="btn" id="dl">Download PDF</button><button class="btn ghost" id="reset">Clear</button></div>'+
  '</section><section class="pv"><div class="pv-label">LIVE PREVIEW · A4</div>'+previewBox('pv')+'</section></div></div>');
  ['name:recipientName','address:address','reference:reference','receiptNumber:receiptNumber','date:date'].forEach(p=>{
    const [id,k]=p.split(':'),el=$('#f-'+id);el.value=M[k];
    el.addEventListener('input',()=>{M[k]=el.value;touched[id]=1;mUpdate()});
    el.addEventListener('blur',()=>{touched[id]=1;mUpdate()});
  });
  renderItems();
  const prep=$('#f-prep');prep.value=biz.preparedBy||'';prep.addEventListener('input',()=>{biz.preparedBy=prep.value;saveBiz();mUpdate()});
  const thumbs=()=>['preparedSig','signature'].forEach(k=>{$('#th-'+k).innerHTML=biz[k]?'<img src="'+esc(biz[k])+'">':'none'});
  thumbs();
  $$('[data-sig]').forEach(b=>b.onclick=()=>pickImage(b.dataset.sig,600,()=>{thumbs();mUpdate()}));
  $$('[data-sigrm]').forEach(b=>b.onclick=()=>{biz[b.dataset.sigrm]='';saveBiz();thumbs();mUpdate()});
  $('#add').onclick=()=>{if(M.items.length>=MAX_ITEMS)return;M.items.push({description:'',amount:''});renderItems();mUpdate();const ds=$$('#items input[data-k=description]');ds[ds.length-1].focus()};
  $('#print').onclick=()=>mOutput('print');

  $('#reset').onclick=()=>{M={recipientName:'',address:'',reference:'',receiptNumber:'',date:todayISO(),items:[{description:'',amount:''}]};touched={};showAll=false;manualView()};
  onBizChange=()=>{mUpdate();const bb=$('#bizb');if(bb)bb.style.display=(biz.name||'').trim()?'none':'flex';const p=$('#f-prep');if(p)p.value=biz.preparedBy||'';['preparedSig','signature'].forEach(k=>{const t=$('#th-'+k);if(t)t.innerHTML=biz[k]?'<img src="'+esc(biz[k])+'">':'none'})};

function renderItems(){
  const box=$('#items');
  box.innerHTML=M.items.map((it,i)=>'<div><div class="item"><input class="input" data-i="'+i+'" data-k="description" placeholder="Description e.g. Soft Skills Fees" value="'+esc(it.description)+'" autocomplete="off">'+
   '<input class="input amt" data-i="'+i+'" data-k="amount" placeholder="Amount ₹" inputmode="decimal" value="'+esc(it.amount)+'" autocomplete="off">'+
   '<button class="x" data-rm="'+i+'" aria-label="Remove item" '+(M.items.length===1?'disabled style="opacity:.35;cursor:not-allowed"':'')+'>✕</button></div><div class="err" id="ie-'+i+'"></div></div>').join('');
  $$('input',box).forEach(el=>{
    el.addEventListener('input',()=>{M.items[+el.dataset.i][el.dataset.k]=el.value;touched['i'+el.dataset.i+el.dataset.k]=1;mUpdate()});
    el.addEventListener('blur',()=>{touched['i'+el.dataset.i+el.dataset.k]=1;mUpdate()});
  });
  $$('[data-rm]',box).forEach(b=>b.onclick=()=>{if(M.items.length<=1)return;M.items.splice(+b.dataset.rm,1);touched={};renderItems();mUpdate()});
}
function mUpdate(){
  if(!$('#pv'))return;
  const r=mReceipt(),e=mErrors(),total=sumItems(r.items);
  $('#pv').innerHTML=receiptHTML(r,biz);
  $('#tot').textContent='₹'+(fmtAmt(total)||'0');
  $('#words').textContent=total>0?amountInWords(total):'—';
  const show=(id,key,msg)=>{const el=$('#e-'+id);if(el)el.textContent=(showAll||touched[key])&&msg?msg:'';const inp=$('#f-'+id);if(inp)inp.classList.toggle('bad',!!((showAll||touched[key])&&msg))};
  show('name','name',e.name);show('receiptNumber','receiptNumber',e.receiptNumber);show('date','date',e.date);
  M.items.forEach((_,i)=>{
    const d=(showAll||touched['i'+i+'description'])&&e.items[i].description,a=(showAll||touched['i'+i+'amount'])&&e.items[i].amount;
    const el=$('#ie-'+i);if(el)el.textContent=[d,a].filter(Boolean).join(' ');
    const ins=$$('[data-i="'+i+'"]');if(ins[0])ins[0].classList.toggle('bad',!!d);if(ins[1])ins[1].classList.toggle('bad',!!a);
  });
  $('#add').disabled=M.items.length>=MAX_ITEMS;
  $('#cap').textContent=M.items.length>=MAX_ITEMS?'Maximum '+MAX_ITEMS+' items fit on one page.':'';
}
async function mOutput(kind,btn){
  showAll=true;const e=mErrors();mUpdate();
  if(mHasErr(e)){toast('Please fix the highlighted fields.','err');const b=$('.input.bad');if(b)b.focus();return}
  const r=mReceipt();r.id='m'+Date.now().toString(36);
  addHistory([r]);
  if(kind==='print')printReceipts([r]);else downloadPdf(r,btn);
}

/* ---------------- import ---------------- */
let IMP={stage:'source',tab:'file',headers:[],data:[],map:{},rows:[],receipts:[],err:'',filterBad:false,label:''};
function importView(){onBizChange=null;if(IMP.stage==='source'||!IMP.headers.length)IMP.stage='source';renderImport()}
function renderImport(){
  const head='<div class="pagehead"><button class="back" id="ib" aria-label="Back">←</button><h1>'+({source:'Import Receipts',map:'Match your columns',results:'Receipts ready'})[IMP.stage]+'</h1></div>';
  if(IMP.stage==='source')sourceStage(head);
  else if(IMP.stage==='map')mapStage(head);
  else resultsStage(head);
  $('#ib').onclick=()=>{if(IMP.stage==='source')location.hash='#/';else if(IMP.stage==='map'){IMP.stage='source';renderImport()}else{IMP.stage='map';renderImport()}};
}
function sourceStage(head){
  setView('<div style="max-width:820px;margin:0 auto">'+head+'<div class="panel">'+
   '<div class="tabs"><button data-t="file" class="'+(IMP.tab==='file'?'on':'')+'">Excel / CSV</button><button data-t="sheet" class="'+(IMP.tab==='sheet'?'on':'')+'">Google Sheets</button></div>'+
   (IMP.tab==='file'?
    '<div class="drop" id="drop"><div class="big">📄</div><b>Upload your Excel or CSV file.</b><p>Drag and drop here, or click to browse · .xlsx .xls .csv</p></div>'+
    '<input type="file" id="fin" accept=".xlsx,.xls,.csv" hidden>'+
    '<div style="margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span class="note">First row should contain column headings. Rows with the same Receipt No. and name become one multi-item receipt.</span><button class="btn sm" id="sample">Download Sample Excel</button></div>':
    '<label class="f" style="font-size:14px;color:var(--txt)">Paste Google Sheets URL<input class="input" id="gurl" placeholder="https://docs.google.com/spreadsheets/d/…" style="margin-top:8px"></label>'+
    '<div style="margin-top:12px"><button class="btn primary" id="gload">Load Sheet</button></div>'+
    '<p class="note" style="margin-top:14px">Google Sheets → File → Share → Publish to web → CSV. The sheet must be published or shared as “Anyone with the link”.</p>')+
   '<div id="ierr">'+(IMP.err?'<div class="msg-err">'+esc(IMP.err)+'</div>':'')+'</div></div></div>');
  $$('.tabs button').forEach(b=>b.onclick=()=>{IMP.tab=b.dataset.t;IMP.err='';renderImport()});
  const showErr=m=>{IMP.err=m;$('#ierr').innerHTML=m?'<div class="msg-err">'+esc(m)+'</div>':''};
  if(IMP.tab==='file'){
    const drop=$('#drop'),fin=$('#fin');
    drop.onclick=()=>fin.click();
    ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
    ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));
    drop.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)handleFile(f,showErr)});
    fin.onchange=()=>{const f=fin.files[0];fin.value='';if(f)handleFile(f,showErr)};
    $('#sample').onclick=downloadSample;
  }else{
    $('#gload').onclick=()=>loadSheet($('#gurl').value,showErr,$('#gload'));
    $('#gurl').addEventListener('keydown',e=>{if(e.key==='Enter')$('#gload').click()});

}
function downloadSample(){
  if(!window.XLSX){toast('Spreadsheet library could not load (offline?).','err');return}
  const aoa=[['Name','Address','Student ID','Receipt No','Date','Particular','Amount'],
   ['Aarav Sharma','A-101 Jaipur','STU-001','101','07/10/26','Soft Skills Fees',850],
   ['Priya Verma','B-204 Jaipur','STU-002','102','07/10/26','Soft Skills Fees',850],
   ['Rahul Kumar','C-118 Jaipur','STU-003','103','07/10/26','Soft Skills Fees',900],
   ['Neha Singh','D-12 Jaipur','STU-004','104','08/10/26','Soft Skills Fees',850],
   ['Neha Singh','D-12 Jaipur','STU-004','104','08/10/26','Registration Fees',500]];
  const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[{wch:18},{wch:18},{wch:12},{wch:11},{wch:11},{wch:22},{wch:10}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Receipts');XLSX.writeFile(wb,'ReceiptFlow-sample.xlsx');
}
function sheetToTable(ws){
  const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true,blankrows:false});
  const nonEmpty=r=>r.some(c=>String(c).trim()!=='');
  const hi=aoa.findIndex(nonEmpty);
  if(hi<0)return null;
  const headers=aoa[hi].map((h,i)=>String(h).trim()||'Column '+(i+1));
  const data=aoa.slice(hi+1).filter(nonEmpty).map(r=>{const o=r.slice(0,headers.length);while(o.length<headers.length)o.push('');return o});
  return {headers,data};
}
function startMapping(t,label){
  IMP.headers=t.headers;IMP.data=t.data;IMP.label=label;IMP.map=autoMap(t.headers);IMP.rows=buildRows(t.data,IMP.map);IMP.stage='map';IMP.filterBad=false;IMP.err='';renderImport();
}
async function handleFile(file,showErr){
  showErr('');
  if(!window.XLSX){showErr('The spreadsheet library could not load. Check your internet connection and reload.');return}
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  if(!['xlsx','xls','csv'].includes(ext)){showErr('Unsupported file type “.'+ext+'”. Please upload .xlsx, .xls or .csv.');return}
  if(file.size>15*1024*1024){showErr('File is too large (limit 15 MB).');return}
  try{
    let wb;
    if(ext==='csv')wb=XLSX.read(await file.text(),{type:'string',raw:true});
    else wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
    let t=null;
    for(const n of wb.SheetNames){t=sheetToTable(wb.Sheets[n]);if(t&&t.data.length)break}
    if(!t){showErr('This file looks empty.');return}
    if(!t.data.length){showErr('Found column headings but no data rows below them.');return}
    startMapping(t,file.name);
  }catch(e){showErr('Could not read this file. It may be corrupted or not a real spreadsheet. ('+(e.message||'unknown error')+')')}
}
function sheetCsvUrl(u){
  u=u.trim();
  if(!/^https?:\/\//i.test(u))return null;
  let url;try{url=new URL(u)}catch(e){return null}
  if(!/(^|\.)docs\.google\.com$/.test(url.hostname)||!/\/spreadsheets\//.test(url.pathname))return null;
  const gid=(url.hash.match(/gid=(\d+)/)||[])[1]||url.searchParams.get('gid');
  let m=url.pathname.match(/\/spreadsheets\/d\/e\/([\w-]+)/);
  if(m)return 'https://docs.google.com/spreadsheets/d/e/'+m[1]+'/pub?output=csv'+(gid?'&gid='+gid:'');
  m=url.pathname.match(/\/spreadsheets\/d\/([\w-]+)/);
  if(m)return 'https://docs.google.com/spreadsheets/d/'+m[1]+'/export?format=csv'+(gid?'&gid='+gid:'');
  return null;
}
async function loadSheet(u,showErr,btn){
  showErr('');
  if(!u.trim()){showErr('Paste a Google Sheets URL first.');return}
  const csvUrl=sheetCsvUrl(u);
  if(!csvUrl){showErr('That doesn’t look like a Google Sheets URL. It should start with https://docs.google.com/spreadsheets/…');return}
  if(!window.XLSX){showErr('The spreadsheet library could not load. Check your internet connection and reload.');return}
  btn.disabled=true;const l=btn.textContent;btn.textContent='Loading…';
  try{
    const res=await fetch(csvUrl);
    if(!res.ok)throw new Error('http '+res.status);
    const text=await res.text();
    if(/^\s*<(!doctype|html)/i.test(text))throw new Error('private');
    const wb=XLSX.read(text,{type:'string',raw:true});
    const t=sheetToTable(wb.Sheets[wb.SheetNames[0]]);
    if(!t){showErr('The sheet appears to be empty.');return}
    if(!t.data.length){showErr('Found column headings but no data rows below them.');return}
    startMapping(t,'Google Sheet');
  }catch(e){
    showErr(e.message==='private'||/http (401|403|404)/.test(e.message)
      ?'This sheet isn’t publicly accessible. Publish it to the web (File → Share → Publish to web → CSV) or set sharing to “Anyone with the link”, then try again.'
      :'Could not load the sheet. Check the URL and your connection, or download the sheet as CSV and use the Excel / CSV upload instead.');
  }finally{btn.disabled=false;btn.textContent=l}
}
function mapStage(head){
  const missing=FIELDS.filter(([k,,req])=>req&&IMP.map[k]<0);
  setView('<div>'+head+'<div class="panel"><div class="note" style="margin-bottom:14px">'+esc(IMP.label)+' · we guessed the columns below. Change any that look wrong.</div>'+
   '<div class="mapgrid">'+FIELDS.map(([k,l,req])=>'<label class="f">'+l+(req?' *':'')+'<select class="input" data-m="'+k+'"><option value="-1">— Not used —</option>'+
     IMP.headers.map((h,i)=>'<option value="'+i+'"'+(IMP.map[k]===i?' selected':'')+'>'+esc(h)+'</option>').join('')+'</select></label>').join('')+'</div>'+
   '<div id="prev"></div></div></div>');
  $$('select[data-m]').forEach(s=>s.onchange=()=>{IMP.map[s.dataset.m]=+s.value;IMP.rows=buildRows(IMP.data,IMP.map);renderPrev()});
  renderPrev();
}
function renderPrev(){
  const box=$('#prev'),missing=FIELDS.filter(([k,,req])=>req&&IMP.map[k]<0);
  if(missing.length){box.innerHTML='<div class="msg-err">Please match: '+missing.map(m=>m[1]).join(', ')+'.</div>';return}
  if(!IMP.rows.length){box.innerHTML='<div class="msg-err">No usable rows found with this column matching.</div>';return}
  box.innerHTML='<div class="sum" id="sum"></div>'+
   '<label class="check" style="margin-bottom:10px"><input type="checkbox" id="onlybad"'+(IMP.filterBad?' checked':'')+'> Show only rows that need attention</label>'+
   '<div class="tablewrap"><table class="dt"><thead><tr><th></th><th>Row</th><th>Name</th><th>Receipt No.</th><th>Date</th><th>Particular</th><th>Amount ₹</th><th>Status</th></tr></thead><tbody id="tb"></tbody></table></div>'+
   '<div style="margin-top:18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap"><button class="btn primary" id="gen"></button><span class="note" id="gnote"></span></div>';
  $('#onlybad').onchange=e=>{IMP.filterBad=e.target.checked;fillRows()};
  $('#gen').onclick=generate;
  const tb=$('#tb');
  tb.addEventListener('input',e=>{const el=e.target,i=+el.dataset.r;if(isNaN(i))return;IMP.rows[i][el.dataset.k]=el.value;refreshRow(i);refreshSum()});
  tb.addEventListener('change',e=>{const el=e.target;if(el.dataset.inc!==undefined){IMP.rows[+el.dataset.inc].include=el.checked;refreshRow(+el.dataset.inc);refreshSum()}});
  fillRows();
}
function rowHTML(r,i){
  const v=validateRow(r);
  const inp=(k,w)=>'<input class="c'+(v.bad[k]?' bad':'')+'" data-r="'+i+'" data-k="'+k+'" value="'+esc(r[k])+'"'+(w?' style="min-width:'+w+'px"':'')+'>';
  return '<tr id="row-'+i+'" class="'+(r.include?(v.errors.length?'bad':''):'skip')+'"><td><input type="checkbox" data-inc="'+i+'" '+(r.include?'checked':'')+' title="Include this row"></td><td>'+r.n+'</td><td>'+inp('name',140)+'</td><td>'+inp('receiptNo',80)+'</td><td>'+inp('date',100)+'</td><td>'+inp('particular',160)+'</td><td>'+inp('amount',80)+'</td>'+statusCell(r,v)+'</tr>';
}
function statusCell(r,v){
  if(!r.include)return '<td class="st">Skipped</td>';
  if(v.errors.length)return '<td class="st e">'+esc(v.errors.join(' '))+'</td>';
  if(v.warns.length)return '<td class="st w">'+esc(v.warns.join(' '))+'</td>';
  return '<td class="st o">✓ Ready</td>';
}
function fillRows(){
  const tb=$('#tb');
  const idx=IMP.rows.map((r,i)=>i).filter(i=>!IMP.filterBad||validateRow(IMP.rows[i]).errors.length||!IMP.rows[i].include&&false);
  tb.innerHTML=idx.map(i=>rowHTML(IMP.rows[i],i)).join('')||'<tr><td colspan="8" class="empty">No rows need attention 🎉</td></tr>';
  refreshSum();
}
function refreshRow(i){
  const r=IMP.rows[i],v=validateRow(r),tr=$('#row-'+i);if(!tr)return;
  tr.className=r.include?(v.errors.length?'bad':''):'skip';
  $$('input.c',tr).forEach(el=>el.classList.toggle('bad',!!v.bad[el.dataset.k]));
  const old=tr.lastElementChild;old.outerHTML=statusCell(r,v);
}
function refreshSum(){
  let ready=0,bad=0,skip=0;
  IMP.rows.forEach(r=>{if(!r.include)skip++;else if(validateRow(r).errors.length)bad++;else ready++});
  $('#sum').innerHTML='<span class="chip ok">✓ '+IMP.rows.length+' rows detected</span><span class="chip">'+ready+' rows ready · '+bad+' rows need attention'+(skip?' · '+skip+' skipped':'')+'</span>';
  const n=groupReceipts(IMP.rows).length;
  const g=$('#gen');g.textContent='Generate '+n+' Receipt'+(n===1?'':'s');g.disabled=n===0;
  $('#gnote').textContent=bad?bad+' row'+(bad===1?'':'s')+' with problems will be left out until fixed or skipped.':'';
}
function generate(){
  const list=groupReceipts(IMP.rows);
  if(!list.length)return;
  IMP.receipts=list;IMP.stage='results';addHistory(list);renderImport();
}
function resultsStage(head){

  setView('<div>'+head+'<div class="panel"><div class="success"><div class="tick">✓</div><div><b style="font-size:18px">'+L.length+' receipt'+(L.length===1?'':'s')+' generated</b><div class="note">Same template, your business profile, one receipt per page.</div></div></div>'+

   '</tbody></table></div></div></div>');
  $('#pa').onclick=()=>printReceipts(L);
  $('#zip').onclick=e=>downloadZip(L,e.currentTarget);
  $('#again').onclick=()=>{IMP.stage='source';IMP.headers=[];renderImport()};
  $$('[data-v]').forEach(b=>b.onclick=()=>viewReceipt(L[+b.dataset.v]));
  $$('[data-p]').forEach(b=>b.onclick=e=>downloadPdf(L[+b.dataset.p],e.currentTarget));
}

/* ---------------- history ---------------- */
function historyView(){
  onBizChange=null;
  setView('<div style="max-width:900px;margin:0 auto"><div class="pagehead"><button class="back" onclick="location.hash=\'#/\'" aria-label="Back">←</button><h1>Recent Receipts</h1><div style="flex:1"></div>'+(history.length?'<button class="btn sm danger" id="clr">Clear all</button>':'')+'</div>'+
   '<div class="panel">'+(history.length?'<div class="tablewrap"><table class="dt"><thead><tr><th>Receipt No.</th><th>Recipient</th><th>Amount</th><th>Date</th><th>Action</th></tr></thead><tbody>'+
   history.map((r,i)=>'<tr><td>'+esc(r.receiptNumber||'—')+'</td><td>'+esc(r.recipientName)+'</td><td>₹'+fmtAmt(sumItems(r.items))+'</td><td>'+esc(fmtDate(r.date)||'—')+'</td><td><button class="btn sm" data-v="'+i+'">View</button></td></tr>').join('')+'</tbody></table></div>'
   :'<div class="empty">No receipts yet.<br>Receipts you print, download or generate will show up here.</div>')+'</div></div>');
  $$('[data-v]').forEach(b=>b.onclick=()=>viewReceipt(history[+b.dataset.v]));
  const c=$('#clr');if(c)c.onclick=()=>{if(confirm('Clear the receipt history on this device?')){history=[];lsSet('rf_history',history);historyView()}};
}

/* ---------------- router ---------------- */
function route(){
  closeModal();
  const h=location.hash.replace(/^#\/?/,'');
  if(h==='manual')manualView();
  else if(h==='import')importView();
  else if(h==='history')historyView();
  else homeView();
}
window.addEventListener('hashchange',route);
window.addEventListener('DOMContentLoaded',route);
if(document.readyState!=='loading')route();
</script>
</body>
</html>
